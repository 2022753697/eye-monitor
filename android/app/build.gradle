plugins {
    id 'com.android.application'
}

// --- 高德 Key 提取（2025-10）：密钥不入仓库，构建时从三处注入 ---
def loadAmapKey() {
    // 1) local.properties（gitignore，本机开发）：amap.key=xxx
    try {
        def local = rootProject.file('local.properties')
        if (local.exists()) {
            def props = new Properties()
            local.withInputStream { props.load(it) }
            def v = props.getProperty('amap.key')
            if (v != null && !v.trim().isEmpty()) return v.trim()
        }
    } catch (Exception ignored) {}
    // 2) gradle 属性（~/.gradle/gradle.properties 或 -PamapKey=xxx）
    if (project.hasProperty('amapKey')) {
        def v = project.property('amapKey').toString().trim()
        if (!v.isEmpty()) return v
    }
    // 3) 环境变量（CI）：AMAP_KEY
    def env = System.getenv('AMAP_KEY')
    if (env != null && !env.trim().isEmpty()) return env.trim()
    println '⚠️ 未配置高德 Key（local.properties amap.key / gradle 属性 amapKey / 环境变量 AMAP_KEY）——地图与定位将不可用'
    return ''
}

android {
    namespace 'com.eyemonitor'
    compileSdk 34

    defaultConfig {
        applicationId 'com.eyemonitor'
        minSdk 24
        targetSdk 34
        versionCode 3
        versionName '1.0.2'

        ndk {
            abiFilters 'armeabi-v7a', 'arm64-v8a'
        }

        // 高德 Key 占位符：构建时注入（local.properties amap.key → gradle 属性 amapKey → 环境变量 AMAP_KEY）
        manifestPlaceholders = [AMAP_KEY: loadAmapKey()]
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    lint {
        // 存量项目有大量历史 lint error（manifest/权限等），lint 作为非阻塞质量门禁：
        // 照常执行并输出报告（含自定义规则），但不因历史问题中断构建
        abortOnError false
    }
}

dependencies {
    // OkHttp (WebSocket + HTTP)
    implementation 'com.squareup.okhttp3:okhttp:4.12.0'

    // Gson (JSON 解析)
    implementation 'com.google.code.gson:gson:2.10.1'

    // AndroidX
    implementation 'androidx.appcompat:appcompat:1.6.1'
    implementation 'androidx.core:core:1.12.0'
    implementation 'com.google.android.material:material:1.11.0'
    implementation 'androidx.constraintlayout:constraintlayout:2.1.4'
    implementation 'androidx.recyclerview:recyclerview:1.3.2'
    implementation 'androidx.viewpager2:viewpager2:1.0.0'

    // 高德地图 3D SDK（内置定位+搜索功能）
    implementation 'com.amap.api:3dmap-location-search:10.1.200_loc6.4.9_sea9.7.4'

    // Room 本地数据库（聊天记录 + 缓存）
    implementation 'androidx.room:room-runtime:2.6.1'
    annotationProcessor 'androidx.room:room-compiler:2.6.1'

    // Glide（头像加载，圆形变换）
    implementation 'com.github.bumptech.glide:glide:4.16.0'
    implementation 'com.github.bumptech.glide:okhttp3-integration:4.16.0'
    annotationProcessor 'com.github.bumptech.glide:compiler:4.16.0'

    // 单元测试（纯 JVM，无 Robolectric）
    testImplementation 'junit:junit:4.13.2'

    // WorkManager（P1 轻量保活：周期自检拉起监控服务）
    implementation 'androidx.work:work-runtime:2.9.0'

    // 自定义 lint 规则（UI 规范：裸 Button）
    lintChecks project(':lintchecks')
}

// ============================================================
// UI 样式护栏 v1：checkUiStyle
// 用法：./gradlew checkUiStyle（已挂接 preBuild，违规即构建失败）
// 规则（元素块级解析，吸取行级 grep 误判换行属性的教训）：
//  1. layout/*.xml 中裸 <Button>（元素块内无 style= 且无自绘 android:background=）→ FAIL
//  2. layout/*.xml 中硬编码 #RRGGBB / #AARRGGBB 色值 → FAIL（drawable/ values/ 除外）
//  3. java/ 中 Color.parseColor("#...") 或 0x.. 硬编码 → WARN（MapActivity 性别色为刻意例外）
// 白名单：确实需要自绘背景的控件保留 android:background= 即视为合规。
// ============================================================
tasks.register('checkUiStyle') {
    group = 'verification'
    description = 'UI 样式护栏：拦截裸 Button 与布局硬编码色值'
    doLast {
        def layoutDir = file('src/main/res/layout')
        def javaDir = file('src/main/java')
        def failures = []
        def warns = []

        // 规则 1 + 2：布局检查
        layoutDir.eachFileMatch(~/.*\.xml$/) { f ->
            def text = f.getText('UTF-8')
            def matcher = text =~ /(?s)<Button\b[^>]*>/
            matcher.each { block ->
                if (!block.contains('style=') && !block.contains('android:background=')) {
                    failures << "裸 Button（无 style）：${f.name}: ${block.replaceAll(/\s+/, ' ').take(70)}"
                }
            }
            def hexMatcher = text =~ /#[0-9A-Fa-f]{6,8}\b/
            hexMatcher.each { hex ->
                failures << "布局硬编码色：${f.name}: ${hex}"
            }
        }

        // 规则 3：Java 硬编码色（warn）
        javaDir.eachFileRecurse { jf ->
            if (!jf.name.endsWith('.java')) return
            jf.getText('UTF-8').split('\n').eachWithIndex { line, i ->
                if (line =~ /Color\.parseColor\("#[0-9A-Fa-f]+"\)/ || line =~ /\b0x[0-9A-Fa-f]{6,8}\b/) {
                    warns << "${jf.name}:${i + 1}: ${line.trim().take(80)}"
                }
            }
        }

        if (warns) {
            warns.each { println "[checkUiStyle] WARN: $it" }
            println '[checkUiStyle] WARN: MapActivity 性别 marker 色为刻意例外，可忽略'
        }
        if (failures.isEmpty()) {
            println "[checkUiStyle] PASS（${layoutDir.listFiles().length} 个布局已检查）"
        } else {
            failures.each { println "[checkUiStyle] FAIL: $it" }
            throw new GradleException("checkUiStyle 未通过：${failures.size()} 处违规")
        }
    }
}

preBuild.dependsOn 'checkUiStyle'