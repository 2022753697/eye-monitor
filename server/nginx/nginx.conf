# 眼互 TLS 终结（域名 twoy.online，ICP 备案通过后启用）
# 反代 app 容器：WSS /ws/eye + REST /api/** 全部透传
# 证书挂载自 ../certs/（fullchain.pem / privkey.pem，见 deploy/tls-switchover.md）

server {
    listen 80;
    server_name twoy.online;
    # HTTP-01 挑战目录（certbot 自动续期方案使用；阿里云免费证书方案可忽略）
    location /.well-known/acme-challenge/ { root /var/www/certbot; }
    location / { return 301 https://$host$request_uri; }
}

server {
    listen 443 ssl;
    http2 on;
    server_name twoy.online;

    ssl_certificate     /etc/nginx/certs/fullchain.pem;
    ssl_certificate_key /etc/nginx/certs/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;

    # WebSocket（WSS）：眼互实时通道（心跳/聊天/位置/配对）
    location /ws/eye {
        proxy_pass http://app:8080;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    # 其余（REST /api/**、媒体 Range 等）全部透传
    location / {
        proxy_pass http://app:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }
}