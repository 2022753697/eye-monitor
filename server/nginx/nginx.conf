# 眼互 TLS 终结（twoy.online）
# 阶段①（免备案）：WSS 监听 18443（阿里云只拦未备案域名的 80/443；8443 曾实测被中游设备 TLS 干扰，换 18443 规避）
# 阶段②（备案通过后）：改回 443 + 80 跳转（见 deploy/tls-switchover.md）
# 证书挂载自 ../certs/（fullchain.pem / privkey.pem，gitignored）

server {
    listen 80;
    server_name twoy.online;
    # HTTP-01 挑战目录（certbot 自动续期方案使用；阿里云免费证书方案可忽略）
    location /.well-known/acme-challenge/ { root /var/www/certbot; }
    # 备案通过后再启用 80→443 跳转（当前阶段 80 保持空闲，避免占用未备案端口）
    # location / { return 301 https://$host$request_uri; }
}

server {
    # 阶段①：18443（免备案）；阶段②：改为 listen 443 ssl;
    # 注：不开 http2 on——WebSocket 基于 HTTP/1.1 Upgrade，且非标端口下 h2 会把 HTTP/1.1 客户端(OkHttp)拒成 400（实测）
    listen 18443 ssl;
    server_name twoy.online;

    ssl_certificate     /etc/nginx/certs/fullchain.pem;
    ssl_certificate_key /etc/nginx/certs/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;

    # F-11（安全加固）：恢复生产 >1MB 上传（后端 multipart.max-file-size=110MB，nginx 默认 1MB 会 413）
    client_max_body_size 110m;

    # F-03（安全加固）：日志不记录 query（防止 ?token=JWT 落入访问日志）；只记路径
    log_format wsauth '$remote_addr - [$time_local] "$request_method $uri $http_version" $status $body_bytes_sent';
    access_log /var/log/nginx/access.log wsauth;

    # WebSocket（WSS）：眼互实时通道（心跳/聊天/位置/配对）
    location /ws/eye {
        proxy_pass http://app:8080;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    # 其余（REST /api/**、媒体 Range 等）全部透传
    location / {
        proxy_pass http://app:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }
}