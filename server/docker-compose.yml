# 眼互后端部署编排（WS2 / ADR-2）
# 用法：
#   1) cp .env.example .env 并填入强随机值（openssl rand -base64 48）
#   2) .env 中 TAILNET_IP 填 ECS 的 tailnet IP（tailscale ip -4 查看）
#   3) docker compose up -d --build
#
# 安全要点（见 .omc/specs/deep-interview-deploy-security.md）：
#   - mysql 不发布 3306：仅 compose 内网可达，公网/宿主机都扫不到（AC6）
#   - app 仅绑定 TAILNET_IP:8080，默认回退 127.0.0.1（AC1/AC2：公网端口扫描 0 开放）
#   - 凭据全部来自 .env（gitignored），ProdCredentialValidator 启动强校验（AC5）
#   - 媒体持久化到 media-data 卷（AC7：解除配对会清空 data/media）
services:
  mysql:
    image: mysql:8.0
    container_name: eye-mysql
    restart: unless-stopped
    environment:
      TZ: Asia/Shanghai
      MYSQL_DATABASE: eye_monitor
      MYSQL_USER: ${DB_USER:-eye}
      MYSQL_PASSWORD: ${DB_PASS:?请在 .env 设置 DB_PASS}
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASS:?请在 .env 设置 DB_ROOT_PASS}
    volumes:
      - mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "--silent"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 30s
    networks: [eye]
    # 注意：刻意不发布 3306

  app:
    build:
      context: .
    container_name: eye-app
    restart: unless-stopped
    depends_on:
      mysql:
        condition: service_healthy
    environment:
      DB_URL: jdbc:mysql://mysql:3306/eye_monitor?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&useSSL=false&allowPublicKeyRetrieval=true
      DB_USER: ${DB_USER:-eye}
      DB_PASS: ${DB_PASS:?请在 .env 设置 DB_PASS}
      JWT_SECRET: ${JWT_SECRET:?请在 .env 设置 JWT_SECRET}
      MEDIA_DIR: /data/media
      AVATAR_DIR: /data/avatar
    volumes:
      - media-data:/data/media
    networks: [eye]
    # 仅绑定 tailnet IP；未配置 TAILNET_IP 时回退 127.0.0.1 作为安全默认
    ports:
      - "${TAILNET_IP:-127.0.0.1}:8080:8080"

  # TLS 终结：twoy.online（证书放 ./certs/，见 deploy/tls-switchover.md）
  # 注意：证书就位前勿启动本服务（nginx -t 会因缺证书文件而 crash-loop）
  nginx:
    image: nginx:1.27-alpine
    container_name: eye-nginx
    restart: unless-stopped
    depends_on:
      app:
        condition: service_started
    ports:
      - "18443:18443"          # 阶段①免备案：WSS 走 18443（8443 被中游 TLS 干扰，换端口规避）
      # - "443:443"            # 阶段②备案通过后启用
      # - "80:80"              # 阶段② 80 跳转/挑战
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ./certs:/etc/nginx/certs:ro
    networks: [eye]

volumes:
  mysql-data:
  media-data:

networks:
  eye:
    driver: bridge

# 说明：
# - mysql 不发布端口，仅 compose 内网（AC6）
# - app 绑定 TAILNET_IP:8080（Tailscale 阶段手机直连；域名切换后 nginx 走容器内网 app:8080，无需再开公网 8080）
# - nginx 挂载 ./certs/（gitignored），证书就位后再 docker compose up 启用