name: CI

# P0 工程质量门禁：双端构建 + 单元测试 + lint，失败阻断合并。
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  server:
    name: Server · build + test
    runs-on: ubuntu-latest
    container: maven:3.9-eclipse-temurin-17
    steps:
      - uses: actions/checkout@v4
      - name: Run unit tests
        run: mvn -B -q test
        working-directory: server
      - name: Package jar
        run: mvn -B -q package -DskipTests
        working-directory: server

  android:
    name: Android · build + unit test + lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      # 本地 gradle.properties 里写死了 Windows JDK 路径，CI 剥离该行（setup-java 提供 JDK17）
      - name: Neutralize local java.home
        run: sed -i '/^org\.gradle\.java\.home=/d' gradle.properties
        working-directory: android
      - name: Grant gradlew
        run: chmod +x gradlew
        working-directory: android
      - name: Assemble debug APK
        run: ./gradlew assembleDebug
        working-directory: android
      - name: Unit tests
        run: ./gradlew testDebugUnitTest
        working-directory: android
      - name: Lint
        run: ./gradlew lintDebug
        working-directory: android